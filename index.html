<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoki Station — Prototipe</title>
<meta name="description" content="Prototipe platform literasi digital Perpustakaan Smanggi Hoki, SMAN 1 Gondanglegi">
<style>
:root{--bg:#fff;--bg2:#F1F5F9;--blue:#2589F5;--navy:#142B50;--green:#16A34A;--gold:#D4A017;--line:#dbe3ec;--mut:#5b6b82;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b2d;--bg2:#17263d;--navy:#e8eef8;--line:#2a3b57;--mut:#9fb0c8}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg2);color:var(--navy)}
header{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{max-width:1000px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:800;color:var(--blue);font-size:19px}.logo small{display:block;font-size:10px;color:var(--mut);font-weight:600;letter-spacing:.5px}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}
nav a{padding:8px 12px;border-radius:10px;color:var(--navy);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
nav a.on{background:var(--blue);color:#fff}
main{max-width:1000px;margin:auto;padding:16px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
h2{margin:0 0 10px;font-size:18px}
.hero{background:var(--blue);color:#fff;border-radius:16px;padding:24px;margin-bottom:16px}
.hero h1{margin:0 0 6px;font-size:24px}.hero p{margin:0 0 14px;opacity:.95}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;min-height:44px}
.btn.alt{background:var(--bg2);color:var(--navy);border:1px solid var(--line)}.hero .btn{background:#fff;color:var(--blue)}.hero .btn.alt{background:transparent;color:#fff;border-color:#fff}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.two{display:grid;gap:16px;grid-template-columns:1fr 1fr}@media(max-width:640px){.two{grid-template-columns:1fr}}
.bar-bg{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden}.bar-fg{height:100%;border-radius:99px;transition:width .3s}
.tag{display:inline-block;background:var(--bg2);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;color:var(--blue)}
.mut{color:var(--mut);font-size:13px}
.work{cursor:pointer}.work:hover{border-color:var(--blue)}.work h3{margin:6px 0 4px;font-size:17px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--navy);margin-bottom:10px}
.ed{min-height:200px;border:1px solid var(--line);border-radius:10px;padding:12px;outline:none;background:var(--bg)}
.tools{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.tools button{min-width:44px}
.rank{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.rank:last-child{border:0}
.pos{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--bg2);font-size:13px}
.p1{background:#f5d76e;color:#5a4300}.p2{background:#d5dbe3;color:#333}.p3{background:#e0a36b;color:#4a2a08}
.av{font-size:24px}.sp{flex:1}
.reader{border-radius:14px;padding:22px;margin:12px 0}
.t-light{background:#fff;color:#1a1a1a}.t-dark{background:#141414;color:#e4e4e4}.t-warm{background:#f6ecd6;color:#4a3320}
.warn{color:#b45309;font-size:13px}.ok{color:var(--green);font-size:13px}
.note{font-size:12px;color:var(--mut);text-align:center;padding:10px}
.menu{position:absolute;right:0;top:46px;background:var(--bg);border:1px solid var(--line);border-radius:12px;min-width:190px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.15)}.menu a,.menu button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:none;color:var(--navy);font:inherit;font-weight:600;border-radius:8px;text-decoration:none;cursor:pointer}.menu a:hover,.menu button:hover{background:var(--bg2)}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:700;padding:4px 0}details p{margin:6px 0 4px}
</style></head><body>
<header><div class="bar"><div class="logo">HOKI STATION<small>SMAN 1 GONDANGLEGI</small></div>
<nav id="nav"></nav><div id="acc" style="position:relative"></div></div></header>
<main id="app"></main>
<div class="note">Prototipe tampilan: data contoh hanya di memori browser dan hilang saat halaman dimuat ulang. Belum ada backend, akun, atau database.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* Unduhan standar browser (untuk GitHub Pages dan hosting statis lain) */
if(!window.claude){window.claude={use:function(){return Promise.resolve({save:function(o){var b=(o.data instanceof Blob)?o.data:new Blob([o.data]);var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=o.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1500);return Promise.resolve()}})}}}
</script>
<script>
var CATS=["Artikel","Berita","Cerpen","Cerbung","Dongeng","Fabel","Novelet","Opini","Pantun","Puisi","Religi","Resensi","Tutorial"];
var AV=["🍎","🍊","🍋","🍉","🍇","🍓","🍍","🥝","🍑","🥭"];
var works=[];
var RK=[];
var CID=10;
var NEWS=[];
var ACCTS=[];var PW={};
var S={at:"laporan",edit:null,del:0,img:[],aud:null,um:[],user:null,menu:false,reg:false,pick:"",w:0,r:0,theme:"light",size:17,reading:null,liked:{},saved:{},rt:"Mingguan"};
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function words(s){var m=s.trim().match(/\S+/g);return m?m.length:0}
function ring(label,val,goal,unit,color){var p=Math.min(100,Math.round(val/goal*100));return '<div class="card"><b>'+label+'</b><div class="mut">'+val+' / '+goal+' '+unit+' · '+p+'%</div><div class="bar-bg"><div class="bar-fg" style="width:'+p+'%;background:'+color+'"></div></div>'+(p>=100?'<div class="ok">Target hari ini tercapai!</div>':'')+'</div>'}
function card(w){return '<div class="card work" onclick="openWork('+w.id+')"><span class="tag">'+esc(w.c)+'</span><h3>'+esc(w.t)+'</h3><div class="mut">'+w.av+' '+esc(w.a)+' · '+w.d+'</div><p>'+esc(w.x.slice(0,90))+'…</p><div class="mut">👁 '+w.r+' · ♥ '+w.l+' · 💬 '+cc(w)+'</div></div>'}
function rankList(rows,n){if(!rows.length)return '<p class="mut">Belum ada data ranking.</p>';return rows.slice(0,n).map(function(r,i){return '<div class="rank"><span class="pos p'+(i+1)+'">'+(i+1)+'</span><span class="av">'+r[0]+'</span><span class="sp">'+esc(r[1])+'</span><b>'+r[2]+' poin</b></div>'}).join("")}
var V={
beranda:function(){return '<div class="hero"><h1>Selamat datang di Hoki Station</h1><p>Tempat warga SMAN 1 Gondanglegi membaca, menulis, dan berbagi karya.</p><a class="btn" href="#menulis">Mulai menulis</a> <a class="btn alt" href="#karya">Lihat karya</a></div>'
+'<div class="two">'+ring("Target menulis",S.w,50,"kata","var(--blue)")+ring("Target membaca",Math.floor(S.r/60),10,"menit","var(--green)")+'</div>'
+'<div class="two"><div class="card"><h2>Ranking mingguan</h2>'+rankList(RK,5)+'<a class="btn alt" href="#ranking">Ranking lengkap</a></div>'
+'<div class="card"><h2>Berita &amp; pengumuman</h2>'+newsHtml()+'</div></div>'
},
menulis:function(){return '<div class="card"><h2>Tulis karya baru</h2><input id="jt" placeholder="Judul karya"><select id="jc">'+CATS.map(function(c){return '<option>'+c+'</option>'}).join("")+'</select>'
+'<div class="tools"><button class="btn alt" onclick="document.execCommand(\'bold\')"><b>B</b></button><button class="btn alt" onclick="document.execCommand(\'italic\')"><i>I</i></button><button class="btn alt" onclick="document.execCommand(\'underline\')"><u>U</u></button></div>'
+'<div id="ed" class="ed" contenteditable="true" oninput="cnt()" role="textbox" aria-label="Isi tulisan"></div><div class="card" style="margin:10px 0"><b>Lampiran</b><div class="mut">Gambar: maksimal 4 foto, tiap foto maksimal 5 MB. Audio: 1 berkas, maksimal 5 MB.</div><input id="fi" type="file" accept="image/*" multiple onchange="addImg(this)"><input id="fa" type="file" accept="audio/*" onchange="addAud(this)"><div id="pv"></div></div><div id="wc" class="mut" style="margin:8px 0"></div><div id="msg"></div>'
+'<button class="btn alt" onclick="draft()">Simpan draf</button> <button class="btn" onclick="pub()">Publikasikan</button></div>'},
karya:function(){return '<div class="card"><input id="q" placeholder="Cari judul, penulis, atau kata kunci…" oninput="filt()"><select id="fc" onchange="filt()"><option value="">Semua kategori</option>'+CATS.map(function(c){return '<option>'+c+'</option>'}).join("")+'</select><select id="so" onchange="filt()"><option value="n">Terbaru</option><option value="r">Paling banyak dibaca</option><option value="l">Paling banyak disukai</option></select></div><div id="list" class="grid"></div>'},
ranking:function(){var rows=S.rt=="Harian"?RK.map(function(r){return [r[0],r[1],Math.round(r[2]/4)]}):RK;return '<div class="card"><h2>Ranking '+S.rt.toLowerCase()+'</h2><button class="btn '+(S.rt=="Harian"?"":"alt")+'" onclick="S.rt=\'Harian\';go()">Harian</button> <button class="btn '+(S.rt=="Mingguan"?"":"alt")+'" onclick="S.rt=\'Mingguan\';go()">Mingguan</button><div style="margin-top:10px">'+rankList(rows,10)+'</div><p class="mut">Skor: pembaca unik 1, like 2, komentar 3, share 2. Peringkat 1–3 mendapat badge Gold, Silver, Bronze.</p></div>'},
admin:function(){if(!S.user||S.user.role!="Admin")return '<div class="card"><h2>Khusus Admin</h2><p class="mut">Halaman ini hanya bisa dibuka akun Admin. Di aplikasi sungguhan, pembatasan ini diperiksa di server.</p></div>';return adminTabs()+AD[S.at]()},
laporanView:function(){var rd=0,lk=0,km=0,cat={};works.forEach(function(w){rd+=w.r;lk+=w.l;km+=cc(w);cat[w.c]=(cat[w.c]||0)+1});
var st=[["Total akun",RK.length+1+ACCTS.filter(function(a){return a.st=="Aktif"}).length],["Menunggu verifikasi",pend()],["Total karya",works.length],["Total pembaca",rd],["Total like",lk],["Total komentar",km]];
var mx=Math.max.apply(null,Object.keys(cat).map(function(k){return cat[k]}));
return '<div class="card"><h2>Laporan &amp; Statistik</h2><p class="mut">Angka dihitung dari data prototipe saat ini. Di aplikasi sungguhan semua angka berasal dari database, dengan filter harian, bulanan, tahunan, dan rentang tanggal.</p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">'+st.map(function(s){return '<div class="card" style="margin:0"><div class="mut">'+s[0]+'</div><div style="font-size:26px;font-weight:800;color:var(--blue)">'+s[1]+'</div></div>'}).join("")+'</div></div>'
+'<div class="card"><h2>Karya per kategori</h2>'+(Object.keys(cat).length?'':'<p class="mut">Belum ada karya.</p>')+Object.keys(cat).map(function(k){return '<div style="margin-bottom:8px">'+k+' ('+cat[k]+')<div class="bar-bg"><div class="bar-fg" style="width:'+Math.round(cat[k]/mx*100)+'%;background:var(--blue)"></div></div></div>'}).join("")+'</div>'
+dlCard()+'<div class="card"><h2>Status backup</h2><p><span class="tag">Google Drive: belum terhubung</span></p><p class="mut">Backup otomatis harian, riwayat backup, dan pemulihan aktif setelah backend dan akun Google Drive sekolah dikonfigurasi.</p></div>'},
panduan:function(){var d=[["Memulai","Buka menu Masuk lalu pilih tab Daftar. Isi nama, username, email, dan password, lalu pilih avatar. Akun baru berstatus Menunggu Verifikasi sampai admin menyetujui dan menetapkan perannya. Setelah disetujui, masuk dengan email atau username dan password Anda."],
["Menulis dan menerbitkan","Buka menu Menulis, isi judul, pilih kategori, lalu tulis karya Anda. Jumlah kata tampil langsung: minimal 10 dan maksimal 1.000 kata. Gunakan tombol B, I, dan U untuk memformat teks. Anda bisa menambahkan maksimal 4 foto (tiap foto maksimal 5 MB) dan 1 audio (maksimal 5 MB). Tekan Publikasikan dan karya langsung tampil di halaman Karya. Admin tetap dapat menyembunyikan karya yang melanggar aturan."],
["Membaca dan menyimpan","Di halaman Karya, cari berdasarkan judul, penulis, atau kata kunci, dan saring berdasarkan kategori. Buka sebuah karya untuk membaca. Pilih tema Terang, Gelap, atau Hangat dan ubah ukuran huruf dengan A− dan A+. Pengaturan ini hanya mengubah area bacaan. Tekan Suka untuk mengapresiasi, dan Simpan untuk menaruhnya di Perpustakaan Saya (menu akun di kanan atas)."],
["Komentar","Di bawah setiap karya Anda bisa menulis komentar (maksimal 500 karakter) dan membalas komentar orang lain. Beri jeda beberapa detik antar komentar. Komentar sendiri bisa dihapus kapan saja. Jika menemukan komentar yang tidak pantas, tekan Lapor agar admin memeriksanya. Gunakan bahasa yang sopan dan membangun."],
["Target harian dan ranking","Beranda menunjukkan target harian: menulis minimal 50 kata dan membaca aktif 10 menit. Waktu baca hanya dihitung saat halaman bacaan terbuka dan aktif. Ranking dihitung dari aktivitas akun: pembaca unik 1 poin, like 2 poin, komentar 3 poin, dan share 2 poin. Tiga besar mingguan mendapat badge Gold, Silver, dan Bronze."],
["Aturan bersama","Tulis karya sendiri dan jangan menjiplak. Hindari konten SARA, ujaran kebencian, kekerasan, dan konten dewasa. Jangan membagikan data pribadi, milik sendiri maupun orang lain. Hormati penulis dan pembaca lain. Pelanggaran dapat membuat karya atau komentar disembunyikan oleh admin."]];
if(S.user&&S.user.role=="Admin")d.push(["Khusus admin","Panel Admin ada di menu akun. Laporan: lihat statistik dan unduh CSV, Excel, atau PDF. Verifikasi: setujui atau tolak pendaftar dan tetapkan perannya. Berita: tulis, edit, dan hapus berita atau pengumuman untuk Beranda. Karya: sembunyikan atau pulihkan karya dan tangani komentar yang dilaporkan. Backup: buat backup manual dan pulihkan data."]);
return '<div class="card"><h2>Panduan pengguna</h2><p class="mut">Ketuk judul untuk membuka penjelasan.</p>'+d.map(function(x,i){return '<details'+(i==0?' open':'')+'><summary>'+x[0]+'</summary><p>'+x[1]+'</p></details>'}).join("")+'</div>'},
profil:function(){if(!S.user)return V.masuk();var mine=works.filter(function(w){return w.a==S.user.name});var tot=mine.reduce(function(a,w){return a+w.r},0);
return '<div class="card" style="text-align:center"><div style="font-size:56px">'+S.user.av+'</div><h2>'+esc(S.user.name)+'</h2><span class="tag">'+S.user.role+'</span><p class="mut">Bergabung November 2026 · '+mine.length+' karya · '+tot+' pembaca</p></div>'
+'<div class="card"><h2>Ganti avatar</h2><div class="tools">'+(S.user.role=="Admin"?'<span class="mut">Akun admin memakai avatar mahkota.</span>':'')+(S.user.role=="Admin"?[]:AV).map(function(a){return '<button class="btn alt" onclick="S.user.av=\''+a+'\';go()">'+a+'</button>'}).join("")+'</div></div>'
+'<div class="card"><h2>Karya saya</h2>'+(mine.length?'<div class="grid">'+mine.map(card).join("")+'</div>':'<p class="mut">Belum ada karya. Mulai dari menu Menulis.</p>')+'</div>'
+'<div class="card"><h2>Prestasi</h2><p class="mut">Badge Gold, Silver, dan Bronze mingguan akan tampil di sini.</p></div>'},
perpus:function(){if(!S.user)return V.masuk();var l=works.filter(function(w){return S.saved[w.id]});return '<div class="card"><h2>Perpustakaan Saya</h2>'+(l.length?'<div class="grid">'+l.map(card).join("")+'</div>':'<p class="mut">Belum ada karya tersimpan. Buka sebuah karya lalu tekan Simpan.</p>')+'</div>'},
masuk:function(){var r=S.reg;var f=r?'<input id="f1" placeholder="Nama lengkap"><input id="f2" placeholder="Username"><input id="f3" type="email" placeholder="Email"><input id="f4" type="password" placeholder="Password"><input id="f5" type="password" placeholder="Konfirmasi password"><div class="mut">Pilih avatar</div><div class="tools">'+AV.map(function(a){return '<button class="btn alt" onclick="S.pick=\''+a+'\';this.style.outline=\'2px solid var(--blue)\'">'+a+'</button>'}).join("")+'</div><button class="btn" onclick="reg2()">Daftar</button>':'<input id="lu" placeholder="Email atau username"><input id="lp" type="password" placeholder="Password"><button class="btn" onclick="login()">Masuk</button> <div id="lm" class="warn" style="margin-top:8px"></div>';
return '<div class="card" style="max-width:440px;margin:auto"><button class="btn '+(r?'alt':'')+'" onclick="S.reg=false;go()">Masuk</button> <button class="btn '+(r?'':'alt')+'" onclick="S.reg=true;go()">Daftar</button><div style="margin-top:12px">'+f+'<div id="rm" style="margin-top:10px"></div></div></div>'},
baca:function(){var w=works.filter(function(x){return x.id==S.reading})[0];if(!w)return "<p>Karya tidak ditemukan.</p>";
return '<a class="btn alt" href="#karya">← Kembali</a><div class="card" style="margin-top:12px"><span class="tag">'+esc(w.c)+'</span><h2 style="font-size:22px;margin-top:8px">'+esc(w.t)+'</h2><div class="mut">'+w.av+' '+esc(w.a)+' · '+w.d+' · ±'+Math.max(1,Math.round(words(w.x)/200))+' menit baca</div>'
+'<div class="tools" style="margin-top:10px"><button class="btn alt" onclick="th(\'light\')">Terang</button><button class="btn alt" onclick="th(\'dark\')">Gelap</button><button class="btn alt" onclick="th(\'warm\')">Hangat</button><button class="btn alt" onclick="sz(-1)">A−</button><button class="btn alt" onclick="sz(1)">A+</button><button class="btn alt" onclick="S.size=17;S.theme=\'light\';go()">Reset</button></div>'
+'<div id="rd" class="reader t-'+S.theme+'" style="font-size:'+S.size+'px;line-height:1.8">'+w.x.split("\n").map(function(p){return '<p>'+esc(p)+'</p>'}).join("")+(w.im||[]).map(function(g){return '<img src="'+g.u+'" alt="" style="max-width:100%;border-radius:10px;margin:8px 0">'}).join("")+(w.au?'<audio controls src="'+w.au.u+'" style="width:100%"></audio>':'')+'</div>'
+'<button class="btn alt" onclick="like('+w.id+')">'+(S.liked[w.id]?"♥ Disukai":"♡ Suka")+' ('+(w.l+(S.liked[w.id]?1:0))+')</button> <button class="btn alt" onclick="S.saved['+w.id+']=!S.saved['+w.id+'];go()">'+(S.saved[w.id]?"🔖 Tersimpan":"🔖 Simpan")+'</button>'
+'<div class="mut" style="margin-top:10px">Waktu baca aktif hari ini: <span id="rs">'+Math.floor(S.r/60)+' mnt '+S.r%60+' dtk</span> (berhenti saat tab tidak aktif)</div></div>'+cmView(w)}
};
function accHtml(){if(!S.user)return '<a class="btn" href="#masuk" style="padding:6px 14px;min-height:36px">Masuk</a>';
return '<button class="btn alt" onclick="S.menu=!S.menu;go()" style="font-size:20px;padding:4px 12px;min-height:40px" aria-label="Menu akun">'+S.user.av+'</button>'+(S.menu?'<div class="menu"><div class="mut" style="padding:6px 12px">'+esc(S.user.name)+' · '+S.user.role+'</div><a href="#profil" onclick="S.menu=false;go()">Profil</a><a href="#perpus" onclick="S.menu=false;go()">Perpustakaan Saya</a>'+(S.user.role=="Admin"?'<a href="#admin" onclick="S.menu=false;go()">Panel Admin</a>':'')+'<button onclick="logout()">Keluar</button></div>':'')}
function logout(){S.user=null;S.menu=false;if(location.hash=="#masuk")go();else location.hash="#masuk"}
function login(){var u=$("lu").value.trim().toLowerCase(),p=$("lp").value;if(!u||!p){$("lm").textContent="Isi username dan password.";return}
if(u=="hokiadmin"){if(p!="UsA7ofEzKDqHhJ"){$("lm").textContent="Username atau password salah.";return}S.user={name:"Admin Hoki",av:"👑",role:"Admin"};location.hash="#admin";return}
var a=ACCTS.filter(function(x){return x.u.toLowerCase()==u||x.e.toLowerCase()==u})[0];
if(!a||PW[a.u]!==p){$("lm").textContent="Username atau password salah.";return}
if(a.st=="Menunggu"){$("lm").textContent="Akun Anda masih menunggu verifikasi admin.";return}
if(a.st!="Aktif"){$("lm").textContent="Akun ini tidak dapat digunakan. Hubungi admin perpustakaan.";return}
