<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hoki Station: Mulai Menulis</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#142B50;--blue:#2589F5;--gray:#F1F5F9;--gold:#E0A526;--green:#2E9E6B}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Nunito,system-ui,sans-serif;background:var(--navy);color:var(--navy);display:flex;flex-direction:column}
#stage{flex:1;min-height:260px;position:relative;overflow:hidden}
#stage svg{width:100%;height:100%;display:block}
#saga{opacity:0;transform:translateX(26px);transition:opacity .5s,transform .5s}
svg.on #saga{opacity:1;transform:none}
.e-l,.m-l,.m-s,.b-s,#scr2{display:none}
svg.l .e-n,svg.l .m-n{display:none}svg.l .e-l,svg.l .m-l{display:inline}
svg.x .m-n,svg.x .b-n{display:none}svg.x .m-s,svg.x .b-s{display:inline}
svg.h #scr1{display:none}svg.h #scr2{display:inline}
@media(prefers-reduced-motion:reduce){#saga{transition:none}}
#card{background:#fff;border-top:6px solid var(--blue);border-radius:16px 16px 0 0;padding:26px 22px calc(22px + env(safe-area-inset-bottom,0px));min-height:230px;max-height:82vh;overflow:auto;position:relative}
#who{position:absolute;top:-6px;left:18px;transform:translateY(-100%);background:var(--blue);color:#fff;font-weight:800;padding:5px 16px;border-radius:10px 10px 0 0;font-size:15px}
#who:empty{display:none}
#txt{font-size:18px;line-height:1.65;max-width:62ch;margin:0 auto}
.n{font-style:italic;color:#3d5278}
.go{max-width:62ch;margin:14px auto 0;text-align:right;color:var(--blue);font-weight:700;font-size:14px;animation:b 1.4s infinite}
@keyframes b{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.go{animation:none}}
.ch{max-width:62ch;margin:18px auto 0;display:grid;gap:10px}
button{font:inherit;cursor:pointer}
.ch button,.act button{border:2px solid var(--blue);background:var(--gray);color:var(--navy);padding:12px 16px;border-radius:12px;font-weight:700;text-align:left}
.ch button:hover,.act button:hover{background:var(--blue);color:#fff}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.w{max-width:62ch;margin:0 auto}
.w p{margin:0 0 10px;line-height:1.55}
.starter{background:var(--gray);border-left:5px solid var(--blue);padding:10px 14px;border-radius:0 10px 10px 0;font-weight:700}
textarea{width:100%;min-height:150px;border:2px solid #c5d3e6;border-radius:12px;padding:12px;font:inherit;font-size:17px;line-height:1.6;resize:vertical}
.bar{height:10px;background:var(--gray);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar b{display:block;height:100%;width:0;background:var(--blue);transition:width .25s}
.bar.ok b{background:var(--gold)}
.meta{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.badge{display:none;margin:12px 0;padding:12px 14px;border-radius:12px;background:#FFF4D6;border:2px solid var(--gold);font-weight:800}
.badge.on{display:block}
.act{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.act a{display:inline-block;border:2px solid var(--blue);background:var(--blue);color:#fff;padding:12px 16px;border-radius:12px;font-weight:800;text-decoration:none}.act a:hover{background:var(--navy);border-color:var(--navy)}.act a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.act button:disabled{opacity:.45;cursor:not-allowed;background:var(--gray);color:var(--navy)}
</style>
</head>
<body>

</g>

</svg></div>
<main id="card" tabindex="0" aria-live="polite">
  <div id="who"></div>
  <div id="txt"></div>
  <div id="area"></div>
</main>
<script>
(function(){var c=['#2589F5','#1c6fd0','#E0A526','#F1F5F9','#5b7db5','#2E9E6B','#c9d6ea','#d9534f'],ns='http://www.w3.org/2000/svg',g=document.getElementById('books');
[[0,118],[282,400]].forEach(function(r){[40,92,144].forEach(function(y){var x=r[0]+4;while(x<r[1]-12){var w=7+Math.random()*7,h=32+Math.random()*12,e=document.createElementNS(ns,'rect');e.setAttribute('x',x);e.setAttribute('y',y+(46-h));e.setAttribute('width',w);e.setAttribute('height',h);e.setAttribute('rx',1);e.setAttribute('fill',c[Math.floor(Math.random()*c.length)]);g.appendChild(e);x+=w+1.5;}})});})();
var mood='n',st=document.getElementById('art');
var rules=[['tertawa kecil','l'],['Semua penulis','n'],['menatapmu serius','x'],['Sip.','l'],['Gak apa-apa','n']];
function stage(l,end){
  if(l.x){rules.forEach(function(r){if(l.x.indexOf(r[0])>-1)mood=r[1]})}
  if(end)mood='l';
  st.setAttribute('class',(i>=1||end?'on ':'')+mood+(end?' h':''));
}

var L=[
{w:'n',x:'Suasana perpustakaan Smanggi Hoki siang itu terasa lebih hidup dari biasanya. Kamu duduk di pojok, menatap layar laptop dengan pandangan kosong. Lagi-lagi buntu. Ditambah suasana perpustakaan yang bising semakin membuatmu lesu. Tiba-tiba—'},
{w:'s',x:'Eh, kamu lagi sibuk ya?'},
{w:'n',x:'Kamu menoleh. Seorang siswa berdiri di sampingmu. Rambutnya agak berantakan, tapi senyumnya santai. Seragamnya rapi, terlihat seperti siswa teladan.'},
{w:'s',x:'Aku Saga. Anak 11-4.'},
{w:'s',x:'Aku lihat-lihat kamu sering ke sini, kan?'},
{w:'n',x:'Saga mengalihkan tatapannya pada layar laptopmu yang terbuka. Membuatmu mengikuti arah tatapannya. Sejenak kamu merasa malu, tapi tetap membiarkannya.'},
{w:'s',x:'Wah, kamu suka nulis, ya?'},
{w:'n',x:'Merasa malu, kamu mengangguk pelan.'},
{w:'n',x:'Saga sedikit mencondongkan tubuhnya untuk melihat ke arah tulisanmu yang berantakan di layar laptop.'},
{w:'s',x:'Tulisanmu bagus, lho. Kenapa nggak dipublish aja di website Hoki Station?'},
{w:'n',x:'Kamu mengernyit, meringis pelan sebelum menjawab,'},
{w:'k',x:'Nggak pede.'},
{w:'n',x:'Saga tertawa kecil. Matanya menyipit membentuk bulan sabit. Dia terlihat lebih manis saat sedang tertawa.'},
{w:'s',x:'Semua penulis awalnya juga gitu. Tapi kalau nggak mulai, tulisanmu cuma jadi draft selamanya.'},
{w:'n',x:'Saga menunjuk layar laptopmu. Membuatmu ikut menaruh perhatian ke sana.'},
{w:'s',x:'Coba deh. Hoki Station itu bukan tempat buat yang udah jago aja, tapi juga buat yang mau berkembang.'},
{w:'n',x:'Kamu mulai ragu.'},
{w:'k',x:'Tapi kalau jelek gimana?'},
{w:'s',x:'Kalau jelek ya diperbaiki. Kalau bagus? Ya dibanggakan. Yang penting nulis aja dulu.'},
{w:'n',x:'Saga menatapmu serius.'},
{w:'s',x:'Website itu dibuat biar suara siswa kayak kita bisa didengar.'},
{c:['Aku coba kirim satu tulisan deh...','Aku masih takut sih...'],r:[
 [{w:'s',x:'Sip. Aku bantu kalau kamu bingung. Siapa tau tulisanmu jadi favorit minggu ini.'}],
 [{w:'s',x:'Gak apa-apa. Tapi janji, ya, suatu hari nanti kamu bakal coba.'}]]}
];
var HOKI='https://perpustakaansmanggi-hash.github.io/Hoki-Station/#masuk';
var ends=['Halaman Hoki Station sudah menunggu tulisan pertamamu.','Hoki Station akan tetap ada kapan pun kamu siap.'];
var i=0,path=[],txt=document.getElementById('txt'),who=document.getElementById('who'),area=document.getElementById('area'),card=document.getElementById('card');
var names={s:'Saga',k:'Kamu',n:''};

function show(){
  area.innerHTML='';var l=L[i];stage(l);
  if(l.c){
    who.textContent='';txt.innerHTML='<span class="n">Apa yang kamu katakan?</span>';
    var d=document.createElement('div');d.className='ch';
    l.c.forEach(function(t,k){var bt=document.createElement('button');bt.textContent=t;bt.onclick=function(e){e.stopPropagation();pick(k)};d.appendChild(bt)});
    area.appendChild(d);return;
  }
  who.textContent=names[l.w];txt.className=l.w==='n'?'n':'';txt.textContent=l.x;
  var g=document.createElement('div');g.className='go';g.textContent='ketuk untuk lanjut ▾';area.appendChild(g);
}
function pick(k){path.push(k);var l=L[i];L.splice.apply(L,[i+1,0,{w:'k',x:l.c[k]}].concat(l.r[k]));i++;show();}
function next(){
  if(L[i].c)return;
  if(i>=L.length-1){write();return;}
  i++;show();
}
card.addEventListener('click',function(e){if(!document.querySelector('.act'))next();});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target===card&&!document.querySelector('.act')){e.preventDefault();next();}});

function write(){
  stage({},true);who.textContent='';txt.className='n';txt.textContent=ends[path[0]||0];
  area.innerHTML='<div class="act w"><a href="'+HOKI+'" target="_blank" rel="noopener">Buka Hoki Station</a><button id="rs">Main lagi</button></div>';
  document.getElementById('rs').onclick=function(e){e.stopPropagation();location.reload()};
}
show();
</script>
